spring:
  datasource:
    url: jdbc:h2:mem:resolveit_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false

app:
  seed:
    enabled: false
  file-storage:
    path: ./target/test-uploads
  security:
    rate-limit-per-minute: 1000
